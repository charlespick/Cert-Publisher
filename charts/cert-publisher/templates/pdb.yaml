{{- if .Values.podDisruptionBudget.enabled -}}
{{- /*
  Only useful with a standby: with one replica a PDB of minAvailable 1 makes
  the node it lands on undrainable, which is worse than the short gap a drain
  would otherwise cause -- the successor pod picks the lease straight back up.
*/ -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cert-publisher.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-publisher.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cert-publisher.selectorLabels" . | nindent 6 }}
{{- end }}

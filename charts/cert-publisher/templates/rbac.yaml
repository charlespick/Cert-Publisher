{{- if .Values.rbac.create -}}
# Cluster-wide watch of CertPublications and read of Secrets, plus management
# of the cert-manager Certificates and CertificateRequests this operator
# creates. Watch verbs are new to the operator: the CronJob only ever listed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-publisher.fullname" . }}
  labels:
    {{- include "cert-publisher.labels" . | nindent 4 }}
rules:
  - apiGroups: ["certpublisher.makerland.xyz"]
    resources: ["certpublications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certpublisher.makerland.xyz"]
    resources: ["certpublications/status"]
    verbs: ["get", "update", "patch"]
  # Required to set blockOwnerDeletion on owned Certificates in clusters that
  # enable OwnerReferencesPermissionEnforcement.
  - apiGroups: ["certpublisher.makerland.xyz"]
    resources: ["certpublications/finalizers"]
    verbs: ["update"]
  # Certificates are looked up by name, created, and patched when the
  # publication spec changes. They are also watched, so an issuance wakes the
  # publication waiting on it instead of waiting for the next resync.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # CertificateRequests sign CSRs generated by hosts that keep their own
  # private key. They are created, read by name, watched for the moment they
  # are signed, and deleted once spent or rejected -- a CertificateRequest's
  # spec is immutable, so a new one is created rather than an existing one
  # updated.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Secrets (issued material and auth) are only ever read by name. Deliberately
  # not list/watch: the operator learns that a certificate was issued from the
  # Certificate resource, so it never needs to stream every Secret in the
  # cluster past itself.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Events are recorded against a publication when its outcome changes, so
  # `kubectl describe certpublication` shows the history.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-publisher.fullname" . }}
  labels:
    {{- include "cert-publisher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-publisher.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-publisher.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

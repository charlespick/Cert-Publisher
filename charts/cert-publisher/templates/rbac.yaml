{{- if .Values.rbac.create -}}
# Cluster-wide read of CertPublications and Secrets, plus management of the
# cert-manager Certificates this operator creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-publisher.fullname" . }}
  labels:
    {{- include "cert-publisher.labels" . | nindent 4 }}
rules:
  - apiGroups: ["certpublisher.makerland.xyz"]
    resources: ["certpublications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certpublisher.makerland.xyz"]
    resources: ["certpublications/status"]
    verbs: ["get", "update", "patch"]
  # Required to set blockOwnerDeletion on owned Certificates in clusters that
  # enable OwnerReferencesPermissionEnforcement.
  - apiGroups: ["certpublisher.makerland.xyz"]
    resources: ["certpublications/finalizers"]
    verbs: ["update"]
  # Certificates are looked up by name, created, and patched when the
  # publication spec changes; the operator never lists or watches them.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "create", "update", "patch"]
  # CertificateRequests sign CSRs generated by hosts that keep their own
  # private key. They are created, read by name, and deleted once spent or
  # rejected -- a CertificateRequest's spec is immutable, so a new one is
  # created rather than an existing one updated.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "create", "delete"]
  # Secrets (issued material and auth) are only ever read by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-publisher.fullname" . }}
  labels:
    {{- include "cert-publisher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-publisher.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-publisher.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.crds.install -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certpublications.certpublisher.makerland.xyz
  labels:
    {{- include "cert-publisher.labels" . | nindent 4 }}
  annotations:
    # Keep the CRD (and any CertPublications) when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  group: certpublisher.makerland.xyz
  scope: Namespaced
  names:
    kind: CertPublication
    plural: certpublications
    singular: certpublication
    shortNames:
      - certpub
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: DNS
          type: string
          jsonPath: .spec.dnsNames[0]
        - name: Provisioner
          type: string
          jsonPath: .spec.provisioner.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Published
          type: date
          jsonPath: .status.lastPublishedTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [dnsNames, issuerRef, provisioner]
              properties:
                dnsNames:
                  type: array
                  minItems: 1
                  items:
                    type: string
                commonName:
                  type: string
                secretName:
                  type: string
                  description: >-
                    Secret cert-manager stores the issued certificate in.
                    Defaults to "<name>-tls".
                duration:
                  type: string
                renewBefore:
                  type: string
                usages:
                  type: array
                  items:
                    type: string
                issuerRef:
                  type: object
                  required: [name, kind]
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum: [Issuer, ClusterIssuer]
                    group:
                      type: string
                provisioner:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [ssh, winrm, dellidrac8]
                    ssh:
                      type: object
                      required: [host, username, hostFingerprint, auth, certPath, keyPath]
                      properties:
                        host:
                          type: string
                        port:
                          type: integer
                          default: 22
                        username:
                          type: string
                        hostFingerprint:
                          type: string
                          description: OpenSSH SHA256 host key fingerprint, e.g. "SHA256:...".
                        auth:
                          type: object
                          required: [secretRef]
                          description: >-
                            Login material. The referenced Secret (in this
                            resource's namespace) supplies password and/or
                            privateKey (+ optional passphrase).
                          properties:
                            secretRef:
                              type: object
                              required: [name]
                              properties:
                                name:
                                  type: string
                        certPath:
                          type: string
                        keyPath:
                          type: string
                        fileMode:
                          type: string
                          default: "0644"
                        keyFileMode:
                          type: string
                          default: "0600"
                        postInstallScript:
                          type: string
                    winrm:
                      type: object
                      required: [host, username, thumbprint, auth]
                      properties:
                        host:
                          type: string
                        port:
                          type: integer
                          default: 5986
                        username:
                          type: string
                        thumbprint:
                          type: string
                          description: SHA1 thumbprint of the WinRM HTTPS listener certificate.
                        transport:
                          type: string
                          default: ntlm
                        auth:
                          type: object
                          required: [secretRef]
                          description: >-
                            Login material. The referenced Secret (in this
                            resource's namespace) supplies the password.
                          properties:
                            secretRef:
                              type: object
                              required: [name]
                              properties:
                                name:
                                  type: string
                        mode:
                          type: string
                          enum: [certStore, file]
                          default: certStore
                        storeLocation:
                          type: string
                          default: LocalMachine
                        storeName:
                          type: string
                          default: My
                        certPath:
                          type: string
                        keyPath:
                          type: string
                        postInstallScript:
                          type: string
                    dellidrac8:
                      type: object
                      required: [host, username, auth]
                      description: >-
                        Install the iDRAC HTTPS certificate on a Dell 12th/13th
                        gen PowerEdge iDRAC8 via its OEM Redfish API. The iDRAC
                        reboots to apply the new certificate.
                      properties:
                        host:
                          type: string
                          description: >-
                            iDRAC hostname or IP. Use the name present in the
                            certificate so the "currently valid" host check can
                            match it across renewals.
                        port:
                          type: integer
                          default: 443
                        username:
                          type: string
                        auth:
                          type: object
                          required: [secretRef]
                          description: >-
                            Login material. The referenced Secret (in this
                            resource's namespace) supplies the password.
                          properties:
                            secretRef:
                              type: object
                              required: [name]
                              properties:
                                name:
                                  type: string
                        bootstrapThumbprint:
                          type: string
                          description: >-
                            SHA-256 thumbprint of the iDRAC HTTPS endpoint
                            certificate, used to verify host identity before a
                            trusted certificate is installed (e.g. the factory
                            self-signed cert). Once a valid cert is in place,
                            verification succeeds via normal PKI and renewals
                            keep working even as the thumbprint changes.
                        caBundle:
                          type: string
                          description: >-
                            Optional PEM CA bundle used to judge whether the live
                            endpoint certificate is currently valid. Defaults to
                            the system trust store plus the issuing chain of the
                            certificate being published.
                        reboot:
                          type: boolean
                          default: true
                          description: >-
                            Reboot the iDRAC after import to apply the new
                            certificate. iDRAC8 requires this; leave enabled.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Pending, Published, or Error.
                message:
                  type: string
                publishedFingerprint:
                  type: string
                  description: SHA-256 fingerprint of the leaf last confirmed on the target.
                lastPublishedTime:
                  type: string
                  format: date-time
                lastReconcileTime:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
{{- end }}

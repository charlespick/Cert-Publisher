{{- if .Values.crds.install -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certpublications.certpublisher.makerland.xyz
  labels:
    {{- include "cert-publisher.labels" . | nindent 4 }}
  annotations:
    # Keep the CRD (and any CertPublications) when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  group: certpublisher.makerland.xyz
  scope: Namespaced
  names:
    kind: CertPublication
    plural: certpublications
    singular: certpublication
    shortNames:
      - certpub
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: DNS
          type: string
          jsonPath: .spec.dnsNames[0]
        - name: Provisioner
          type: string
          jsonPath: .spec.provisioner.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Published
          type: date
          jsonPath: .status.lastPublishedTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [dnsNames, issuerRef, provisioner]
              properties:
                dnsNames:
                  type: array
                  minItems: 1
                  items:
                    type: string
                commonName:
                  type: string
                secretName:
                  type: string
                  description: >-
                    Secret cert-manager stores the issued certificate in.
                    Defaults to "<name>-tls".
                duration:
                  type: string
                renewBefore:
                  type: string
                usages:
                  type: array
                  items:
                    type: string
                issuerRef:
                  type: object
                  required: [name, kind]
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum: [Issuer, ClusterIssuer]
                    group:
                      type: string
                provisioner:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [ssh, winrm, idrac8]
                    ssh:
                      type: object
                      required: [host, username, hostFingerprint, auth, certPath, keyPath]
                      properties:
                        host:
                          type: string
                        port:
                          type: integer
                          default: 22
                        username:
                          type: string
                        hostFingerprint:
                          type: string
                          description: OpenSSH SHA256 host key fingerprint, e.g. "SHA256:...".
                        auth:
                          type: object
                          required: [secretRef]
                          description: >-
                            Login material. The referenced Secret (in this
                            resource's namespace) supplies password and/or
                            privateKey (+ optional passphrase).
                          properties:
                            secretRef:
                              type: object
                              required: [name]
                              properties:
                                name:
                                  type: string
                        certPath:
                          type: string
                        keyPath:
                          type: string
                        fileMode:
                          type: string
                          default: "0644"
                        keyFileMode:
                          type: string
                          default: "0600"
                        postInstallScript:
                          type: string
                    idrac8:
                      type: object
                      required: [host, username, auth]
                      description: >-
                        Dell iDRAC8 (12th/13th-gen PowerEdge). The iDRAC will
                        not accept an externally generated private key by any
                        supported route, so it generates its own keypair and
                        CSR and cert-manager signs it. No private key is sent
                        to the host, and none of duration/renewBefore is
                        delegated to cert-manager -- a signed CertificateRequest
                        is never renewed, so cert-publisher owns renewal timing
                        for this provisioner.
                      properties:
                        host:
                          type: string
                          description: >-
                            Prefer the DNS name in the certificate: once a
                            trusted certificate is installed, host verification
                            succeeds on validity alone and bootstrapThumbprint
                            stops being consulted.
                        port:
                          type: integer
                          default: 443
                        username:
                          type: string
                          description: >-
                            An iDRAC user with Configure iDRAC privilege. Use a
                            dedicated local account: Active Directory accounts
                            are frequently rejected for API access on this
                            generation.
                        auth:
                          type: object
                          required: [secretRef]
                          description: >-
                            Login material. The referenced Secret (in this
                            resource's namespace) supplies password.
                          properties:
                            secretRef:
                              type: object
                              required: [name]
                              properties:
                                name:
                                  type: string
                        bootstrapThumbprint:
                          type: string
                          description: >-
                            Lowercase hex SHA-256 of the certificate the iDRAC
                            serves today (colons optional), used to establish
                            trust on first use before any trusted certificate
                            exists. Ignored once the live certificate validates
                            normally. Take it from a network path that is not
                            TLS-inspected, or it will pin the interceptor.
                        caBundle:
                          type: string
                          description: >-
                            PEM CA bundle used to validate the live endpoint.
                            When set it REPLACES the system trust store rather
                            than adding to it, so it must contain the CA that
                            signs the published certificate. A BMC has no public
                            identity, so trusting every public CA would widen
                            this check rather than tighten it.
                        reset:
                          type: boolean
                          default: true
                          description: >-
                            Reset the iDRAC after importing, which is what makes
                            the new certificate take effect. Firmware 2.86.86.86
                            answers an import with "Reset iDRAC to apply new
                            certificate. Until iDRAC is reset, the old
                            certificate will be active", so this is required in
                            practice despite Dell's profile claiming the import
                            restarts the iDRAC on its own. Disabling it leaves
                            each imported certificate inactive until the iDRAC
                            is reset by other means.
                    winrm:
                      type: object
                      required: [host, username, thumbprint, auth]
                      properties:
                        host:
                          type: string
                        port:
                          type: integer
                          default: 5986
                        username:
                          type: string
                        thumbprint:
                          type: string
                          description: SHA1 thumbprint of the WinRM HTTPS listener certificate.
                        transport:
                          type: string
                          default: ntlm
                          enum:
                            - ntlm
                            - kerberos
                            - negotiate
                            - basic
                            - credssp
                            - certificate
                            - ssl
                            - plaintext
                          description: >-
                            WinRM authentication protocol. NTLM works for
                            workgroup and domain hosts alike; kerberos or
                            negotiate is preferable where a domain service
                            account is available. "ssl" and "plaintext" are
                            accepted as legacy pywinrm spellings and both
                            authenticate with basic over the HTTPS listener,
                            which is the only listener cert-publisher talks to;
                            prefer "basic" in new publications.
                        auth:
                          type: object
                          required: [secretRef]
                          description: >-
                            Login material. The referenced Secret (in this
                            resource's namespace) supplies the password.
                          properties:
                            secretRef:
                              type: object
                              required: [name]
                              properties:
                                name:
                                  type: string
                        mode:
                          type: string
                          enum: [certStore, file]
                          default: certStore
                        storeLocation:
                          type: string
                          default: LocalMachine
                        storeName:
                          type: string
                          default: My
                        exportablePrivateKey:
                          type: boolean
                          default: false
                          description: >-
                            Mark the private key exportable when importing
                            into the Windows certificate store (certStore
                            mode only). Windows doesn't support toggling this
                            on an already-imported certificate, so changing
                            it on an existing publication only takes effect
                            the next time the certificate is renewed; the
                            status message notes when this is pending.
                        certPath:
                          type: string
                        keyPath:
                          type: string
                        postInstallScript:
                          type: string
                          description: >-
                            PowerShell run on the target after a successful
                            install. Must be non-interactive: the run is
                            unattended, so Read-Host, Get-Credential, nested
                            prompts or unbound mandatory parameters fail the
                            publication rather than waiting for an answer.
                        powershell:
                          type: string
                          enum: ["5.1", "7"]
                          default: "5.1"
                          description: >-
                            PSRP session configuration used to run
                            postInstallScript. "5.1" uses the default Windows
                            PowerShell endpoint, present on every supported
                            Windows version. "7" uses the PowerShell.7
                            endpoint, which PowerShell 7+ registers only when
                            its remoting is enabled (the installer's "Enable
                            PowerShell remoting" option, or Enable-PSRemoting
                            run from pwsh) -- installing PowerShell 7 alone is
                            not enough. The script's
                            $env:CERT_PUBLISHER_THUMBPRINT is set either way to
                            the newly installed certificate's SHA-1 thumbprint
                            (40 uppercase hex characters, no separators).
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Pending, Published, or Error.
                message:
                  type: string
                publishedFingerprint:
                  type: string
                  description: SHA-256 fingerprint of the leaf last confirmed on the target.
                lastSigningTime:
                  type: string
                  format: date-time
                  description: >-
                    When a signing round was last opened for a provisioner
                    whose host keeps its own private key. Used to throttle a
                    round that never converges, since each one rotates the
                    host's key.
                pendingRequestName:
                  type: string
                  description: >-
                    CertificateRequest currently being signed for a provisioner
                    whose host keeps its own private key. Set only while a
                    signing round is in flight.
                lastPublishedTime:
                  type: string
                  format: date-time
                lastReconcileTime:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
{{- end }}

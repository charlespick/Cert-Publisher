# Default values for cert-publisher.

image:
  repository: ghcr.io/charlespick/cert-publisher
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

crds:
  # Install the CertPublication CRD as part of the release. Set to false if you
  # manage the CRD separately (e.g. a shared cluster where another release owns
  # it). When true the CRD is upgraded with the release.
  install: true

rbac:
  # Create the ClusterRole and ClusterRoleBinding the controller needs to watch
  # CertPublications and read Secrets cluster-wide and manage cert-manager
  # Certificates.
  create: true

serviceAccount:
  create: true
  # Name of the service account to use. Generated from the fullname when empty.
  name: ""
  annotations: {}

# Controller configuration, surfaced as environment variables on the pod.
config:
  logLevel: INFO
  # Leave empty to reconcile CertPublications across the whole cluster, or set a
  # namespace to scope reconciliation to it.
  watchNamespace: ""

controller:
  # How many publications may be reconciled at once. Each one is a slow,
  # network-bound conversation with a host, so this is about not letting one
  # unreachable target hold up the rest -- reconciles of the *same*
  # publication are serialised no matter what this is set to.
  workers: 4
  # How often a settled publication is looked at again, in seconds. Watches
  # cover everything that happens inside the cluster; this covers what does
  # not raise an event at all -- a certificate replaced on the host by hand, an
  # iDRAC that reverted, a host-keyed certificate ageing into its renewal
  # window.
  resyncInterval: 1800
  # Fraction of resyncInterval to scatter resyncs over, so a fleet issued on
  # the same afternoon does not reconcile in lockstep forever.
  resyncJitter: 0.2
  # Window, in seconds, to spread the first reconcile of every publication
  # over after startup or a relist. Converging on a fleet should not mean
  # opening a connection to all of it at once.
  startupSpread: 60
  # Exponential backoff between retries of a failing publication, in seconds:
  # first retry after backoffBase, doubling to backoffMax. A failure is
  # recorded on that publication's .status and retried; it never fails the pod
  # or holds up any other publication.
  backoffBase: 5
  backoffMax: 900
  # How long each watch connection lives before the apiserver closes it and the
  # controller resumes. A bounded watch is how a silently dead connection gets
  # noticed.
  watchTimeout: 300
  # How long a shutdown waits for an in-flight publish to finish. Keep
  # terminationGracePeriodSeconds comfortably above this.
  shutdownTimeout: 30
  # How long a single reconcile may run before the liveness probe treats this
  # pod as wedged and the kubelet restarts it. A provisioner call that hangs
  # with no timeout of its own would otherwise hold its worker forever and
  # starve every publication behind it. Keep it above the slowest legitimate
  # publish -- an iDRAC import and reset takes minutes.
  reconcileTimeout: 900

healthProbe:
  port: 8080
  # /healthz fails when a watch has gone silent or a reconcile has hung, which
  # restarts the pod. A watch that is failing -- RBAC, a missing CRD -- is not
  # silent: it logs each failure and keeps retrying, since a restart would not
  # fix it.
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # /readyz passes once every watch has listed successfully: proof the pod can
  # reach the apiserver with the RBAC it needs.
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Extra environment variables for the container.
extraEnv: []

# Must exceed controller.shutdownTimeout so a publish in flight can finish.
terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# Deprecated. The controller was a CronJob before it was an operator, and it no
# longer polls on a schedule -- it watches. Only `cronjob.suspend` still does
# anything: it scales the StatefulSet to zero, as it used to suspend the
# CronJob. Everything else here is ignored, and the whole block will be removed
# in a future release.
cronjob:
  suspend: false

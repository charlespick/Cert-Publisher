# Import a certificate into the Windows LocalMachine\My store over WinRM.
apiVersion: v1
kind: Secret
metadata:
  name: win01-creds
  namespace: default
type: Opaque
stringData:
  password: "replace-me"
---
apiVersion: certpublisher.makerland.xyz/v1alpha1
kind: CertPublication
metadata:
  name: win01
  namespace: default
spec:
  dnsNames:
    - win01.example.com
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  provisioner:
    type: winrm
    winrm:
      host: win01.example.com
      port: 5986
      username: Administrator
      thumbprint: "REPLACE_WITH_LISTENER_SHA1_THUMBPRINT"
      transport: ntlm
      auth:
        secretRef:
          name: win01-creds
      mode: certStore
      storeLocation: LocalMachine
      storeName: My
      # Optional: mark the private key exportable (e.g. so it can be backed
      # up or re-exported later). Changing this on an existing publication
      # only takes effect the next time the certificate is renewed, since
      # Windows can't change an already-imported key's exportability.
      # exportablePrivateKey: true
      # Optional: bind the freshly imported cert to a service, e.g. rebind IIS.
      # The hook can read $env:CERT_PUBLISHER_THUMBPRINT for the newly installed
      # certificate's SHA-1 thumbprint (40 uppercase hex chars, no colons).
      # postInstallScript: |
      #   Import-Module WebAdministration
      #   ...
      # Optional: run postInstallScript with PowerShell 7 (pwsh.exe) instead
      # of the default Windows PowerShell 5.1. PowerShell 7 must already be
      # installed on the target host.
      # powershell: "7"

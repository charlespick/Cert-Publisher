[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-publisher"
version = "0.1.0"
description = "Publish cert-manager certificates to non-Kubernetes hosts over SSH and WinRM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Charles Pickering", email = "me@charlespick.xyz" }]
dependencies = [
  "kubernetes>=29.0.0",
  "paramiko>=3.4.0",
  "pypsrp>=0.8.1",
  "cryptography>=42.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.0"]

[project.scripts]
cert-publisher = "cert_publisher.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The WinRM provisioner runs static, parameterised PowerShell scripts
# rather than assembling command text at runtime; they ship in the wheel.
"cert_publisher.provisioners" = ["scripts/*.ps1"]

[tool.ruff]
line-length = 100
target-version = "py311"

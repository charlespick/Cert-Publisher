apiVersion: batch/v1
kind: CronJob
metadata:
  name: cert-publisher
  namespace: cert-publisher
spec:
  # Every 30 minutes. cert-manager decides when a cert is renewed; this job
  # just picks up the new material and pushes it to targets on its next run.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: cert-publisher
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cert-publisher
              image: ghcr.io/charlespick/cert-publisher:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: LOG_LEVEL
                  value: INFO
                # Leave WATCH_NAMESPACE empty to reconcile the whole cluster.
                - name: WATCH_NAMESPACE
                  value: ""
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-publisher
  namespace: cert-publisher
---
# Cluster-wide read of CertPublications and Secrets, plus management of the
# cert-manager Certificates this operator creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-publisher
rules:
  - apiGroups: ["certpublisher.charlespick.xyz"]
    resources: ["certpublications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-publisher
subjects:
  - kind: ServiceAccount
    name: cert-publisher
    namespace: cert-publisher
